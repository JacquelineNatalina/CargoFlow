{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="painel painel-login">
    <h1>Entrar no CargoFlow</h1>
    <form method="post" action="{{ url_for('login') }}" class="formulario">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Usuário
            <input type="text" name="usuario" required autofocus autocomplete="username"
                   autocapitalize="none" spellcheck="false" value="{{ usuario or '' }}">
        </label>
        <label>Senha
            <input type="password" name="senha" required autocomplete="current-password">
        </label>
        <button type="submit" class="botao">Entrar</button>
    </form>
</section>
{% endblock %}
